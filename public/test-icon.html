<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SVG Preview</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f4f8;
      font-family: sans-serif;
      flex-direction: column;
    }
    .icon-container {
      background: white;
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    svg {
      width: 150px;
      height: 150px;
      color: #2c3e50; /* Changed from currentColor so it's visible */
    }
  </style>
</head>
<body>
  <h2>ඔයා එවපු SVG කෝඩ් එකේ Preview එක:</h2>
  <div class="icon-container">
    <svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2H2v10l9.29 9.29c.39.39 1.02.39 1.41 0l7.59-7.59c.39-.39.39-1.02 0-1.41L12 2z"></path>
      <path d="m16.5 7.5-.5.5"></path>
      <circle cx="7" cy="7" r="1" fill="currentColor"></circle>
    </svg>
  </div>
  <p style="margin-top: 20px; color: #7f8c8d;">මේක නිකන්ම නිකන් ඉරි වලින් අඳින ලද 'Price Tag' (මිල දාන ටැග් එකක්) අයිකන් එකක් විතරයි.</p>
</body>
</html>
