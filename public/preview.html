<!DOCTYPE html>

<head>

  <style>
    /* =========================================
       Why Choose Us - Premium SVG Version
       ========================================= */
    body {
      background-color: #f7fafc;
      padding: 50px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    .eden-features-wrapper {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1100px;
      margin: 40px auto;
    }

    .eden-feature-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .eden-icon-box {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      width: 100%;
      aspect-ratio: 1; /* Make it a perfect square */
      max-height: 220px; 
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .eden-icon-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .eden-icon-box svg {
      width: 100%;
      height: 100%;
      max-width: 110px;
      max-height: 110px;
      /* Adding a tiny drop shadow to SVGs to match the 3D look in the image */
      filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.05));
    }

    .eden-feature-title {
      font-size: 18px !important;
      font-weight: 600 !important;
      color: #2d3748 !important;
      margin: 0 0 6px 0 !important;
      line-height: 1.3 !important;
    }

    .eden-feature-subtitle {
      font-size: 14px !important;
      color: #718096 !important;
      margin: 0 !important;
      font-weight: 400 !important;
    }

    /* Mobile Responsiveness */
    @media (max-width: 991px) {
      .eden-features-wrapper {
        grid-template-columns: repeat(2, 1fr);
        gap: 30px;
      }
    }

    @media (max-width: 480px) {
      .eden-features-wrapper {
        grid-template-columns: 1fr;
        gap: 40px;
      }
      .eden-icon-box {
        max-width: 200px;
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
